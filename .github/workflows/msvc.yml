name: MSVC
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: [main, qt-port]
    paths:
      - '**'
      - '!**.md'
      - '**/msvc.yml'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '**/msvc.yml'

jobs:
  build:
    runs-on: windows-latest

    env:
      QT_VERSION: '5.15.2'
      QT_ARCH: win64_msvc2019_64
      QT_DIR: ${{ github.workspace }}\Qt

    steps:
      - uses: actions/checkout@v7

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: ${{ env.QT_DIR }}
          key: qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}

      - name: Install Qt5 via aqtinstall
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop ${{ env.QT_VERSION }} ${{ env.QT_ARCH }} -O ${{ env.QT_DIR }}

      - name: Add Qt to PATH
        run: echo "${{ env.QT_DIR }}\${{ env.QT_VERSION }}\msvc2019_64\bin" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Patch Qt 5.15.2 for MSVC 19.38+
        # Qt 5.15.2 predates upstream's "#if _MSC_VER < 1938" guard, so its
        # containers still call stdext::make_checked_array_iterator, which the
        # MSVC STL removed in VS 2022 17.8. Deleting the two stdext defines
        # lets Qt's own "#ifndef" fallback lower them to (x) — the same result
        # upstream's guard produces on new compilers. Upstream fixed this in a
        # later 5.15.x, but open-source binaries stop at 5.15.2.
        shell: pwsh
        run: |
          $f = "$env:QT_DIR\$env:QT_VERSION\msvc2019_64\include\QtCore\qcompilerdetection.h"
          $before = Get-Content $f
          $after = $before | Where-Object { $_ -notmatch 'define QT_MAKE_(UN)?CHECKED_ARRAY_ITERATOR.*stdext' }
          if ($before.Count -ne $after.Count) {
            Set-Content -Path $f -Value $after
            Write-Host "Removed $($before.Count - $after.Count) stdext define(s)"
          } else {
            Write-Host "No stdext defines present; nothing to patch"
          }

      - name: Install Meson and Ninja
        # Pin to <1.11 to avoid mesonbuild/meson#15705: Qt tool detection
        # regression in 1.11.0 that crashes with 'NoneType has no attribute
        # extend' on Windows/qmake. Remove pin once upstream fixes it.
        run: pip install 'meson<1.11' ninja

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        run: |
          meson setup build --backend=ninja
          ninja -C build

      - name: Test
        run: meson test -C build --print-errorlogs
